name: Server image

# Builds the server image (the API and the parent web app, server/Dockerfile) and publishes it to
# ghcr.io/jamesgallagher/screentime-server, tagged latest and with the commit. Unraid pulls latest
# (docs/guides/deploy.md). Runs on every push to main that changes the server, the web app or what they use.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "server/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

concurrency:
  group: server-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/jamesgallagher/screentime-server:latest
            ghcr.io/jamesgallagher/screentime-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jamesgallagher/ScreenTime
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
